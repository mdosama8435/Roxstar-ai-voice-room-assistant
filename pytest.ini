[pytest]
pythonpath = . backend
addopts = --import-mode=importlib
testpaths = backend/tests agents/tests tests
# asyncio_mode=auto: required by existing async tests in test_orchestration.py, test_llm.py,
# test_llm_fallback.py, and agents/tests/test_stt_provider.py that use pytest.mark.asyncio.
# pytest-asyncio==1.4.0 was installed as part of Phase 3D to fix 51 pre-existing failures
# caused by missing plugin. Verified pre-existing failures are environment failures, not
# code failures. Phase 3D TTS tests also require async support.
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning
