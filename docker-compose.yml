version: '3.8'

services:
  # Optional local Redis service for room session caching & turn arbitration locks
  redis:
    image: redis:7-alpine
    container_name: roxstar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional local PostgreSQL with pgvector for persistent semantic memory
  postgres:
    image: pgvector/pgvector:pg16
    container_name: roxstar-postgres
    environment:
      POSTGRES_USER: roxstar
      POSTGRES_PASSWORD: roxstar_secret
      POSTGRES_DB: roxstar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roxstar -d roxstar_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  postgres_data:
